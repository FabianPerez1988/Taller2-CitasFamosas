
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Citas Famosas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div style="text-align: center; margin-top: 40px;">

    <h1>Bienvenido a Citas Famosas</h1>

    <p>Descubre una frase famosa cada día.</p>

    <p *ngIf="cargando()">
      Cargando citas...
    </p>

    <ion-card *ngIf="citaActual() as cita">

      <ion-card-header>
        <ion-card-title>
          "{{ cita.texto }}"
        </ion-card-title>
      </ion-card-header>

      <ion-card-content>
        — {{ cita.autor }}
      </ion-card-content>

    </ion-card>

    <p *ngIf="!cargando() && !citaActual()">
      No hay citas disponibles.
    </p>

    <ion-button
      expand="block"
      (click)="cambiarCita()"
      [disabled]="cargando() || !citaActual()"
      class="ion-margin-top">
      Otra frase
    </ion-button>

    <ion-button
      *ngIf="permitirEliminar() && citaActual()"
      expand="block"
      color="danger"
      (click)="eliminarCitaActual()"
      [disabled]="cargando()"
      class="ion-margin-top">
      Eliminar cita
    </ion-button>

    <ion-button
      expand="block"
      color="secondary"
      routerLink="/gestion-citas"
      class="ion-margin-top">
      Gestionar citas
    </ion-button>

    <ion-button
      expand="block"
      color="medium"
      routerLink="/configuracion"
      class="ion-margin-top">
      Configuración
    </ion-button>

  </div>

</ion-content>
