
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Gestión de Citas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-button
    expand="block"
    (click)="volverInicio()">
    Volver al inicio
  </ion-button>

  <h2>Agregar nueva cita</h2>

  <ion-item>
    <ion-label position="stacked">
      Frase famosa
    </ion-label>

    <ion-textarea
      [(ngModel)]="nuevaFrase"
      placeholder="Escribe una frase famosa">
    </ion-textarea>
  </ion-item>

  <ion-item>
    <ion-label position="stacked">
      Autor
    </ion-label>

    <ion-input
      [(ngModel)]="nuevoAutor"
      placeholder="Escribe el nombre del autor">
    </ion-input>
  </ion-item>

  <ion-button
    expand="block"
    (click)="agregarCita()"
    class="ion-margin-top">
    Agregar cita
  </ion-button>

  <h2 class="ion-margin-top">
    Citas registradas
  </h2>

  <ion-list>

    <app-cita
      *ngFor="let cita of listaCitas()"
      [cita]="cita"
      [permitirEliminar]="permitirEliminar()"
      (solicitarEliminar)="eliminarCita($event)">
    </app-cita>

  </ion-list>

  <p
    *ngIf="listaCitas().length === 0"
    class="ion-padding">
    No hay citas registradas.
  </p>

  <p
    *ngIf="!permitirEliminar()"
    class="ion-padding">
    La eliminación de citas está desactivada en Configuración.
  </p>

</ion-content>
